name: Cross-Compilation & Release

on:
  push:
    tags:
      - 'start_compile*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Install RISC-V Toolchain
        uses: gregdavill/setup-riscv-gnu-toolchain@v2.0
        with:
          package-xpm: '@xpack-dev-tools/riscv-none-elf-gcc@latest'

      - name: Install ESP-IDF (Xtensa)
        uses: espressif/esp-idf-ci-action@v1
        with:
          target: esp32
          esp_idf_version: v5.2

          command: |
            git config --global --add safe.directory "*"
            mkdir -p build_output/xtensa
            echo "fake esp32 binary" > build_output/xtensa/firmware_esp32.bin

      - name: Package Artifacts into Archives
        run: |
          mkdir -p release_assets
          
          cd build_output/arm && zip -r ../../release_assets/firmware-arm.zip . && cd ../..
          cd build_output/riscv && zip -r ../../release_assets/firmware-riscv.zip . && cd ../..
          cd build_output/xtensa && zip -r ../../release_assets/firmware-xtensa.zip . && cd ../..
          
          ls -l release_assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release_assets/firmware-arm.zip
            release_assets/firmware-riscv.zip
            release_assets/firmware-xtensa.zip
