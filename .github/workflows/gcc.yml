name: Package Cross-Compilers to Release

on:
  push:
    tags:
      - 'start_compile*'

jobs:
  package-toolchains:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare directories
        run: mkdir -p toolchains_to_export release_assets

      - name: Install Arm GNU Toolchain
        id: install-arm
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Package ARM Toolchain
        run: |
          ARM_PATH=$(dirname $(dirname $(which arm-none-eabi-gcc)))
          echo "ARM compiler found at: $ARM_PATH"
          
          cp -r "$ARM_PATH" ./toolchains_to_export/arm-none-eabi-gcc
          
          cd toolchains_to_export && zip -r ../release_assets/arm-none-eabi-gcc-ubuntu.zip arm-none-eabi-gcc && cd ..

      - name: Install RISC-V Toolchain
        uses: xpack/setup-xpack-action@v3
        with:
          package-xpm: '@xpack-dev-tools/riscv-none-elf-gcc@latest'

      - name: Package RISC-V Toolchain
        run: |
          RISCV_PATH=$(dirname $(dirname $(which riscv-none-elf-gcc)))
          echo "RISC-V compiler found at: $RISCV_PATH"
          
          cp -r "$RISCV_PATH" ./toolchains_to_export/riscv-none-elf-gcc
          cd toolchains_to_export && zip -r ../release_assets/riscv-none-elf-gcc-ubuntu.zip riscv-none-elf-gcc && cd ..

      - name: Download and Package Xtensa Toolchain
        run: |
          XTENSA_URL="https://github.com"
          
          echo "Downloading Xtensa GCC from Espressif..."
          wget -q $XTENSA_URL -O xtensa-toolchain.tar.gz
          
          echo "Unpacking..."
          tar -xzf xtensa-toolchain.tar.gz -C ./toolchains_to_export/
          
          mv ./toolchains_to_export/xtensa-esp-elf ./toolchains_to_export/xtensa-esp32-elf-gcc
          
          cd toolchains_to_export && zip -r ../release_assets/xtensa-esp32-elf-gcc-ubuntu.zip xtensa-esp32-elf-gcc && cd ..

      - name: Verify generated archives
        run: ls -lh release_assets/

      - name: Create GitHub Release and Upload Toolchains
        uses: softprops/action-gh-release@v2
        with:
          name: Toolchains Pack ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release_assets/arm-none-eabi-gcc-ubuntu.zip
            release_assets/riscv-none-elf-gcc-ubuntu.zip
            release_assets/xtensa-esp32-elf-gcc-ubuntu.zip
